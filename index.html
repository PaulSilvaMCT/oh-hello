<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oh, Hello.</title>

  <meta
    name="description"
    content="Oh, Hello — Andrea's story, advocacy, and accountability project."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f2eb;
      color: #27231f;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(900px, 88%);
      text-align: center;
      padding: 70px 20px;
    }

    .eyebrow {
      margin-bottom: 28px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #786f66;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 11vw, 8rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .meet {
      margin: 35px 0 10px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
    }

    .intro {
      max-width: 650px;
      margin: 25px auto 0;
      font-size: clamp(1.1rem, 2.4vw, 1.4rem);
      line-height: 1.7;
    }

    .motto {
      margin: 42px auto 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-style: italic;
    }

    .coming {
      margin-top: 55px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      color: #786f66;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">A story about Andrea</div>

    <h1>Oh, Hello.</h1>

    <div class="meet">Meet Andrea.</div>

    <p class="intro">
      A living story about family, care, dignity, advocacy,
      and the life of a woman who deserves to be known as a person
      before she is ever treated as a case.
    </p>

    <p class="motto">
      A person is not a case.
    </p>

    <div class="coming">
      Her story is coming soon.
    </div>
  </main>
</body>
</html>
